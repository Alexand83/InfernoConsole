appId: com.infernoconsole.app
productName: Inferno Console
copyright: Copyright © 2024 Inferno Console Team

# Configurazione per Windows - Solo NSIS Installer
win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false

# Configurazione NSIS
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: false  # ✅ Disabilitato - lo creiamo manualmente in installer.nsh
  perMachine: false
  runAfterFinish: true
  artifactName: Inferno-Console-Setup.${ext}
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  # ✅ Mostra sempre i dettagli durante disinstallazione
  warningsAsErrors: false
  # ✅ Usa NSIS 3.11 (versione più recente con bug fix)
  nsisVersion: "3.11"
  # ✅ Chiude automaticamente l'app prima dell'installazione (solo Inferno Console.exe, non node.exe generico)
  include: build/installer.nsh

# Configurazione per macOS
mac:
  # Riattivata pubblicazione automatica - workflow unificato
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Inferno-Console-${version}-mac-${arch}.${ext}
  category: public.app-category.music
  # icon: build/icon.icns  # Commented out - using default Electron icon
  hardenedRuntime: true
  gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist  # Temporaneamente disabilitato per test
  # entitlementsInherit: build/entitlements.mac.plist  # Temporaneamente disabilitato per test
  # Configurazione per auto-updater su macOS
  electronUpdaterCompatibility: ">=2.16"

# Linux rimosso - non necessario

# File da includere
files:
  - dist/**
  - electron/**
  - package.json
  - node_modules/@ffmpeg-installer/**
  - node_modules/ws/**
  - scripts/**

# Configurazione ASAR
asar: true
asarUnpack:
  - node_modules/@ffmpeg-installer/**
  - node_modules/ffmpeg-static/**
  - node_modules/ws/**

# Risorse extra
extraResources:
  - from: node_modules/@ffmpeg-installer/win32-x64/ffmpeg.exe
    to: ffmpeg.exe

# Compressione (configurata per target specifici)

# Directory di output
directories:
  output: dist-electron
  buildResources: build

# Configurazione globale per build multipli
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false

# Configurazione per la versione e compressione
generateUpdatesFilesForAllChannels: true
compression: maximum

# ✅ Configurazione esplicita per generare latest.yml con NSIS

# Configurazione auto-updater
publish:
  provider: github
  owner: Alexand83
  repo: InfernoConsole
  releaseType: release
  # Configurazione per auto-updater
  publishAutoUpdate: true

# ✅ FIX: Forza generazione file di aggiornamento tramite publish


# Configurazione per download differenziali
