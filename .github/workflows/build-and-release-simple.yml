name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build NSIS Installer (Windows)
      if: matrix.os == 'windows-latest'
      run: npm run dist:win
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Verify NSIS Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "Checking NSIS installer files..."
        echo "Current directory: $(Get-Location)"
        echo "Contents of dist-electron:"
        Get-ChildItem dist-electron/ | Select-Object Name, Length
        echo ""
        echo "Checking required files..."
        $requiredFiles = @(
          "dist-electron\Inferno-Console-Setup.exe",
          "dist-electron\latest.yml"
        )
        
        foreach ($file in $requiredFiles) {
          if (Test-Path $file) {
            $size = (Get-Item $file).Length
            echo "✅ $file - $([math]::Round($size/1MB, 2)) MB"
          } else {
            echo "❌ $file - MISSING"
          }
        }

        # Verify NSIS installer exists
        if (!(Test-Path "dist-electron\Inferno-Console-Setup.exe")) {
          echo "❌ NSIS installer missing"
          exit 1
        }
        
        # Verify latest.yml exists
        if (!(Test-Path "dist-electron\latest.yml")) {
          echo "❌ latest.yml missing"
          exit 1
        }
        
        echo "✅ All NSIS files verified"


    - name: Create Release (Windows)
      if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Inferno Console ${{ github.ref_name }}
        body: |
          ## 🎵 Inferno Console ${{ github.ref_name }}
          
          ### ✨ Caratteristiche
          - **Installer NSIS professionale** con interfaccia moderna
          - **Auto-update integrato** - aggiornamenti automatici nella stessa directory
          - **Selezione directory** personalizzabile
          - **Shortcut automatici** Desktop e Start Menu
          - **Uninstaller integrato** per rimozione completa
          - **Chiusura automatica** dell'app prima dell'installazione
          
          ### 📦 Download
          **Windows**: Scarica `Inferno-Console-Setup.exe` (~135 MB)
          
          ### 🚀 Installazione
          1. Scarica `Inferno-Console-Setup.exe`
          2. Esegui l'installer
          3. Scegli la directory di installazione
          4. Clicca "Install"
          5. L'app si avvia automaticamente!
          
          ### 🔄 Aggiornamenti Automatici
          - L'app controlla automaticamente gli aggiornamenti all'avvio
          - Download e installazione silenziosa in background
          - Aggiornamenti sempre nella stessa directory
          
          ### 📝 Note
          - Versione sviluppata da Alessandro (NeverAgain)
          - Licenza MIT
          - Supporto completo per streaming Icecast
          - Compatibilità: Windows 7+
        files: |
          dist-electron/Inferno-Console-Setup.exe
          dist-electron/latest.yml
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      continue-on-error: true